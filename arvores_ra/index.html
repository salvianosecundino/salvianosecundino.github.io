  <title>Árvores em Realidade Aumentada</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: system-ui, -apple-system, sans-serif; background: #f1f4ec; color: #1f2d1a;
      padding: calc(24px + env(safe-area-inset-top)) 16px calc(32px + env(safe-area-inset-bottom));
    }
    header { max-width: 640px; margin: 0 auto 20px; text-align: center; }
    h1 { margin: 0; font-size: 26px; }
    header p { margin: 6px 0 0; font-size: 15px; opacity: .7; }
    ul { list-style: none; margin: 0 auto; padding: 0; max-width: 640px; display: grid; gap: 12px; }
    a.arvore {
      display: flex; align-items: center; gap: 14px; padding: 10px 14px 10px 10px;
      background: #fff; border-radius: 16px; text-decoration: none; color: inherit;
      box-shadow: 0 1px 4px rgba(0,0,0,.08); border-left: 6px solid var(--cor);
      transition: transform .12s, box-shadow .12s;
    }
    a.arvore:active { transform: scale(.98); }
    a.arvore:hover { box-shadow: 0 4px 14px rgba(0,0,0,.12); }
    a.arvore img { width: 76px; height: 76px; border-radius: 12px; object-fit: cover; flex: none; background: #eef3f8; }
    .info { flex: 1; min-width: 0; }
    .nome { font-size: 18px; font-weight: 650; }
    .cientifico { font-size: 13px; font-style: italic; opacity: .65; margin-top: 1px; }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px; }
    .tag { font-size: 12px; padding: 3px 9px; border-radius: 20px; background: #eef1e8; white-space: nowrap; }
    .tag.flor { background: color-mix(in srgb, var(--cor) 16%, white); }
    .seta { font-size: 22px; opacity: .35; flex: none; }
    footer { max-width: 640px; margin: 22px auto 0; text-align: center; font-size: 13px; opacity: .6; }
  </style>
</head>
