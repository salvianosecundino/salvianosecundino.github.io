<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pitangueira em RA</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
  <style>
    html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; background: #eef3ea; color: #1f2d1a; }
    model-viewer { width: 100%; height: 100%; --poster-color: transparent; }
    .topo {
      position: absolute; top: 0; left: 0; right: 0; z-index: 2;
      padding: 18px 20px 10px; text-align: center; pointer-events: none;
    }
    .topo h1 { margin: 0; font-size: 22px; }
    .topo p  { margin: 4px 0 0; font-size: 14px; opacity: .75; }
    #botao-ar {
      position: absolute; left: 50%; bottom: 32px; transform: translateX(-50%);
      background: #c0391b; color: #fff; border: 0; border-radius: 30px;
      padding: 16px 28px; font-size: 18px; font-weight: 600;
      box-shadow: 0 4px 14px rgba(0,0,0,.25); cursor: pointer; white-space: nowrap;
    }
    #sem-ar {
      position: absolute; left: 16px; right: 16px; bottom: 28px; z-index: 2;
      background: #fff; border-radius: 12px; padding: 14px 16px; font-size: 14px;
      text-align: center; box-shadow: 0 2px 10px rgba(0,0,0,.15); display: none;
    }
    #progresso {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      font-size: 15px; opacity: .7;
    }
  </style>
</head>
<body>
  <model-viewer
    id="mv"
    src="pitangueira.glb"
    alt="Pitangueira com frutos, 1,5 metro de altura"
    ar
    ar-modes="webxr scene-viewer quick-look"
    ar-placement="floor"
    ar-scale="fixed"
    camera-controls
    touch-action="pan-y"
    auto-rotate
    shadow-intensity="1"
    exposure="1.1"
    camera-orbit="30deg 80deg auto">

    <div class="topo">
      <h1>Pitangueira 🌱</h1>
      <p>Eugenia uniflora · 1,5 m de altura</p>
    </div>

    <div id="progresso" slot="progress-bar">Carregando a árvore…</div>

    <button slot="ar-button" id="botao-ar">📱 Ver na sala</button>

    <div id="sem-ar">
      Este aparelho ou navegador não abre realidade aumentada.<br>
      No <b>Android</b>, use o Chrome; no <b>iPhone</b>, use o Safari.
    </div>
  </model-viewer>

  <script>
    const mv = document.getElementById('mv');
    mv.addEventListener('load', () => {
      document.getElementById('progresso').style.display = 'none';
      if (!mv.canActivateAR) document.getElementById('sem-ar').style.display = 'block';
    });
  </script>
</body>
</html>
